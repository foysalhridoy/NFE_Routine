<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFE 241B | DIU Class Routine</title>
  <meta name="description" content="Official Class Routine for NFE 241B - Daffodil International University. Minimal, cute, and live class tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cute-light-theme">
  <!-- Subtle Soft Mesh Glows -->
  <div class="mesh-glow mesh-1"></div>
  <div class="mesh-glow mesh-2"></div>

  <div class="app-wrap">
    <!-- 1. Header: Cute & Minimal -->
    <header class="top-nav">
      <div class="nav-brand">
        <div class="brand-badge-pill">
          <span class="cute-dot"></span>
          <span class="badge-txt">DIU ROUTINE</span>
        </div>
        <div class="brand-heading">
          <h1>NFE <span class="sec-highlight">241B</span></h1>
        </div>
      </div>

      <div class="nav-time-card">
        <div class="time-icon-cute">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="none">
            <defs>
              <linearGradient id="clockBezel" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#bae6fd"/>
                <stop offset="1" stop-color="#0284c7"/>
              </linearGradient>
              <linearGradient id="clockDial" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#ffffff"/>
                <stop offset="1" stop-color="#f0f9ff"/>
              </linearGradient>
            </defs>
            <circle cx="16" cy="16" r="14" fill="url(#clockBezel)" stroke="#0284c7" stroke-width="1.2"/>
            <circle cx="16" cy="16" r="11" fill="url(#clockDial)"/>
            <circle cx="16" cy="7.5" r="0.9" fill="#0284c7"/>
            <circle cx="24.5" cy="16" r="0.9" fill="#0284c7"/>
            <circle cx="16" cy="24.5" r="0.9" fill="#0284c7"/>
            <circle cx="7.5" cy="16" r="0.9" fill="#0284c7"/>
            <path d="M16 16L16 9.5" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
            <path d="M16 16L21 16" stroke="#0284c7" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="16" cy="16" r="1.8" fill="#0284c7"/>
            <circle cx="16" cy="16" r="0.8" fill="#ffffff"/>
          </svg>
        </div>
        <div class="time-text-block">
          <div class="clock-display" id="currentTime">--:--:-- --</div>
          <div class="date-display" id="currentDate">--</div>
        </div>
      </div>
    </header>

    <!-- 2. Live Class Radar (Hero Card) -->
    <section class="live-hero-card" id="radarCard">
      <div class="live-hero-header">
        <div class="live-status-pill" id="radarStatusWrap">
          <span class="pulse-spark"></span>
          <span class="status-name" id="radarStatusBadge">CHECKING STATUS</span>
        </div>
        <span class="live-time-meta" id="radarMeta">Live Sync</span>
      </div>

      <div class="live-hero-content">
        <div class="live-title-row">
          <div class="cute-subject-icon" id="radarSubjectIcon">
            <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
              <defs>
                <linearGradient id="heroBookGrad" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#38bdf8"/>
                  <stop offset="1" stop-color="#0284c7"/>
                </linearGradient>
              </defs>
              <path d="M6 6C6 6 11 5 16 8C21 5 26 6 26 6V23C26 23 21 22 16 25C11 22 6 23 6 23V6Z" fill="url(#heroBookGrad)"/>
              <path d="M16 8V25" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="subject-info-wrap">
            <h2 class="live-subject-name" id="radarSubject">Loading class...</h2>
            <div class="live-chips-row">
              <span class="cute-chip chip-room" id="radarRoom">
                <svg viewBox="0 0 20 20" width="14" height="14" fill="none"><defs><linearGradient id="hPinGrad" x1="4" y1="2" x2="16" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs><path d="M10 2C6.13 2 3 5.13 3 9C3 13.5 10 18.5 10 18.5C10 18.5 17 13.5 17 9C17 5.13 13.87 2 10 2Z" fill="url(#hPinGrad)"/><circle cx="10" cy="8.5" r="2.8" fill="#ffffff"/></svg>
                <span>Room: --</span>
              </span>
              <span class="cute-chip chip-slot" id="radarTime">
                <svg viewBox="0 0 20 20" width="14" height="14" fill="none"><circle cx="10" cy="10" r="7.5" fill="#f8fafc" stroke="#0284c7" stroke-width="1.6"/><path d="M10 6.5V10L12.5 11.5" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span>--:-- - --:--</span>
              </span>
            </div>
          </div>
        </div>

        <!-- Live Progress Track -->
        <div class="live-progress-container" id="radarProgressWrap">
          <div class="progress-info-row">
            <span id="progressElapsedText">Class Progress</span>
            <span class="remaining-highlight" id="progressRemainingText">-- mins left</span>
          </div>
          <div class="cute-track">
            <div class="cute-fill" id="radarProgressBar" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <!-- Up Next News Ticker -->
      <div class="up-next-ticker" id="radarNextCard" role="region" aria-label="Upcoming classes live news ticker">
        <div class="ticker-badge">
          <span class="ticker-pulse-dot" aria-hidden="true"></span>
          <span class="ticker-badge-title">UP NEXT</span>
        </div>
        <div class="ticker-viewport">
          <div class="ticker-track" id="tickerTrack">
            <!-- Dynamically populated duplicate sets for seamless 60fps marquee -->
          </div>
        </div>
      </div>
    </section>

    <!-- 3. Navigation Controls Bar -->
    <nav class="nav-control-bar">
      <div class="day-selector-group">
        <button class="cute-today-btn" id="todayQuickBtn" title="Go to Today">
          <span class="sparkle-anim">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none">
              <defs>
                <linearGradient id="spkGold" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#fbbf24"/>
                  <stop offset="0.5" stop-color="#f59e0b"/>
                  <stop offset="1" stop-color="#d97706"/>
                </linearGradient>
              </defs>
              <path d="M10 2L12.2 7.8L18 10L12.2 12.2L10 18L7.8 12.2L2 10L7.8 7.8L10 2Z" fill="url(#spkGold)"/>
              <circle cx="10" cy="10" r="1.6" fill="#ffffff"/>
            </svg>
          </span>
          <span>Today</span>
        </button>

        <div class="day-tabs-track">
          <div class="day-tabs" id="dayTabs">
            <button class="tab-item" data-day="Saturday">Sat</button>
            <button class="tab-item" data-day="Sunday">Sun</button>
            <button class="tab-item" data-day="Monday">Mon</button>
            <button class="tab-item" data-day="Tuesday">Tue</button>
            <button class="tab-item" data-day="Wednesday">Wed</button>
            <button class="tab-item" data-day="Thursday">Thu</button>
            <button class="tab-item" data-day="Friday">Fri</button>
          </div>
        </div>
      </div>
    </nav>

    <!-- 4. Main Section: Cards View -->
    <main class="content-view" id="cardsView">
      <div class="day-header-strip">
        <div class="dh-left">
          <h2 id="activeDayHeading">Saturday</h2>
          <span class="day-pill-badge" id="activeDayPill">Class Day</span>
        </div>
        <div class="dh-right" id="daySummaryStat">--</div>
      </div>

      <div class="cards-flow" id="cardsGrid">
        <!-- Rendered by app.js -->
      </div>
    </main>

    <!-- 6. Clean Minimal Footer -->
    <footer class="cute-footer">
      <div class="footer-content">
        <span class="footer-heart">✨</span>
        <span class="footer-title">NFE 241B</span>
        <span class="footer-sep">•</span>
        <span>Nutrition & Food Engineering</span>
        <span class="footer-sep">•</span>
        <span>DIU</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
